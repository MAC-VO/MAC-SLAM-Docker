# System-level configuration are the same for all develop services
x-common-config: &common-config
  hostname: ${HOSTNAME:-macslam}-dev
  # Run as host user so bind-mounted /workspace stays host-owned. HOST_UID/GID exported by compose.sh.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  # Mount /dev to give access to all devices including:
  # - video0/video1: Stereo camera pair
  # - hidraw*: ZED IMU/sensors (MCU communicates over USB HID)
  # - bus/usb: USB bus
  volumes:
    - ../../:/workspace
    - /dev:/dev
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
  working_dir: /workspace
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  stdin_open: true
  runtime: nvidia
  tty: true

  # For profiliing in a Docker container
  cap_add:
    - SYS_ADMIN
  privileged: true

  # Host networking: rerun visualizer (port 9876) is reachable directly, no port mapping needed.
  network_mode: host

  # Sufficient IPC shared memory for PyTorch as instructed in NVIDIA container.
  ipc: host
  ulimits:
    memlock:
      soft: -1
      hard: -1
    stack: 67108864

  # Two-site Python layout so a stray `pip install` in the container can't permanently break the env:
  #   * Casual `pip install`s -> the *ephemeral* user-site at PYTHONUSERBASE=/tmp/pip-user
  #     (container-local; wiped on `docker compose run --rm`). PIP_USER routes installs there by
  #     default, so accidents (e.g. pulling numpy>=2) only affect the current session.
  #   * Compiled/editable features -> the *persistent* feature site at /workspace/Cache/feature_site
  #     (bind-mounted). Tools/setup.sh installs them there (it overrides PYTHONUSERBASE), and
  #     Cache/feature_bootstrap/sitecustomize.py (auto-loaded via PYTHONPATH) registers that dir as a
  #     real site dir so the editable .pth/finder files run. HOME stays on the bind mount so the pip
  #     wheel cache + shell history persist.
  environment:
    - NVIDIA_DRIVER_CAPABILITIES=all
    - NVIDIA_VISIBLE_DEVICES=all
    - PYTHONUNBUFFERED=1
    - HOME=/workspace/Cache/docker_home
    - PYTHONUSERBASE=/tmp/pip-user
    - PIP_USER=1
    - PYTHONPATH=/workspace/Cache/feature_bootstrap

# Per-resource configuration service.
services:
  linux-cuda128-dev:
    <<: *common-config
    profiles: ["amd64"]
    platform: linux/amd64
    image: macslam/mac-slam:linux-cu128-amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "nvcr.io/nvidia/pytorch:25.03-py3"
        CUDA_MAJOR_VERSION: "12"

  linux-cuda126-dev:
    <<: *common-config
    profiles: ["amd64"]
    platform: linux/amd64
    image: macslam/mac-slam:linux-cu126-amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "nvcr.io/nvidia/pytorch:24.09-py3"
        CUDA_MAJOR_VERSION: "12"

  linux-cuda130-dev:
    <<: *common-config
    profiles: ["amd64"]
    platform: linux/amd64
    image: macslam/mac-slam:linux-cu130-amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "nvcr.io/nvidia/pytorch:25.08-py3"
        CUDA_MAJOR_VERSION: "13"

  jetson-thor-dev:
    <<: *common-config
    profiles: ["arm64"]
    platform: linux/arm64
    image: macslam/mac-slam:linux-cu130-thor-arm64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "nvcr.io/nvidia/pytorch:25.08-py3"
        CUDA_MAJOR_VERSION: "13"

    # Load stripped nsys module.
    environment:
      - PATH=/opt/nvidia/nsight-systems/2025.4.1/bin:/opt/nvidia/nsight-compute/2025.3.0/bin:$PATH

    volumes:
      - ../../:/workspace
      - /dev:/dev
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /opt/nvidia/nsight-systems/:/opt/nvidia/nsight-systems/
      - /opt/nvidia/nsight-compute/:/opt/nvidia/nsight-compute/

  jetson-orin-dev:
    <<: *common-config
    profiles: ["arm64"]
    platform: linux/arm64
    image: macslam/mac-slam:linux-cu126-orin-arm64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "nvcr.io/nvidia/pytorch:25.03-py3-igpu"
        CUDA_MAJOR_VERSION: "12"

    # Fix the libjpeg library problem for PyZed & Load stripped nsys
    environment:
      - PATH=/opt/nvidia/nsight-systems/2024.5.4/bin:/opt/nvidia/nsight-compute/2024.3.1/bin:$PATH
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/tegra:$LD_LIBRARY_PATH

    volumes:
      - ../../:/workspace
      - /dev:/dev
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra
      - /usr/lib/aarch64-linux-gnu/libjpeg.so.8:/usr/lib/aarch64-linux-gnu/libjpeg.so.8
      - /opt/nvidia/nsight-systems/:/opt/nvidia/nsight-systems/
      - /opt/nvidia/nsight-compute/:/opt/nvidia/nsight-compute/

  dev-unified-entry:
    <<: *common-config

    image: ${DEV_IMAGE}
    platform: ${DEV_PLATFORM}
    container_name: macslam-unified-dev
    command: sleep infinity
